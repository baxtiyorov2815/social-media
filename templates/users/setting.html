
{% extends 'users/base.html' %}
{% block head %} <a href="{% url 'home' %}">Home</a> / Account Setting / General / <b>{{ user.username }}</b> {% endblock head %}
{% block content %}
    <form action="" method="POST">
        {% csrf_token %}
        <div class="grid lg:grid-cols-3 mt-12 gap-8">

            <!-- Left Column -->
            <div>
                <h3 class="text-xl mb-2">General</h3>
            </div>

            <!-- Right Column (Form Body) -->
            <div class="bg-white rounded-md lg:shadow-lg shadow col-span-2">
                <div class="grid grid-cols-2 gap-3 lg:p-6 p-4">
                    <div>
                        <label>First name</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="First name.." class="shadow-none bg-gray-100">
                    </div>
                    <div>
                        <label>Last name</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}" placeholder="Last name.." class="shadow-none bg-gray-100">
                    </div>
                    <div class="col-span-2">
                        <label>Email</label>
                        <input type="text" name="email" value="{{ user.email }}" class="shadow-none bg-gray-100" readonly>
                    </div>
                    <div class="col-span-2">
                        <label for="about">About me</label>
                        <textarea id="about" name="bio" rows="3" class="shadow-none bg-gray-100">{{ profile.bio }}</textarea>
                    </div>
                    <div class="col-span-2">
                        <label>Location</label>
                        <input type="text" name="location" value="{{ profile.locations }}" placeholder="Location ..." class="shadow-none bg-gray-100">
                    </div>
                    <div>
                        <label>Working at</label>
                        <input type="text" name="working_at" value="{{ profile.working_at }}" placeholder="working at ..." class="shadow-none bg-gray-100">
                    </div>
                    <div>
                        <label>Relationship</label>
                        <select id="relationship" name="relationship" class="shadow-none bg-gray-100">
                            <option value="none" {% if profile.relationship == "none" %}selected{% endif %}>None</option>
                            <option value="single" {% if profile.relationship == "single" %}selected{% endif %}>Single</option>
                            <option value="in_a_rel" {% if profile.relationship == "in_a_rel" %}selected{% endif %}>In a relationship</option>
                            <option value="merried" {% if profile.relationship == "merried" %}selected{% endif %}>Married</option>
                            <option value="engaged" {% if profile.relationship == "engaged" %}selected{% endif %}>Engaged</option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xl mb-2">Privacy</h3>
            </div>

            <div class="bg-white rounded-md lg:shadow-lg shadow lg:p-6 p-4 col-span-2">
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <div><h4>Private</h4></div>
                        <div class="switches-list -mt-8 is-large">
                            <div class="switch-container">
                                <label class="switch">
                                    <input name="private" type="checkbox" {% if profile.private %} checked {% endif %}>
                                    <span class="switch-button"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="flex justify-between items-center">
                        <div><h4>Show my activities?</h4></div>
                        <div class="switches-list -mt-8 is-large">
                            <div class="switch-container">
                                <label class="switch">
                                    <input name="show_activity" type="checkbox" {% if profile.show_activity %} checked {% endif %}>
                                    <span class="switch-button"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="flex justify-between items-center">
                        <div><h4>Allow Commenting?</h4></div>
                        <div class="switches-list -mt-8 is-large">
                            <div class="switch-container">
                                <label class="switch">
                                    <input name="allow_comms" type="checkbox" {% if profile.allow_comms %} checked {% endif %}>
                                    <span class="switch-button"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex justify-end border-t px-6 py-4">
            <button type="submit" class="button bg-blue-700 text-white px-6 py-2 rounded">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock content %}
